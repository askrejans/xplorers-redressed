name: Framework checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - run: npm run build:bridge
      - run: npm test
      - name: Package macOS universal application
        if: runner.os == 'macOS'
        run: npm run package:mac
      - name: Package Windows x64 application
        if: runner.os == 'Windows'
        run: npm run package:win
      - name: Package Linux x64 application
        if: runner.os == 'Linux'
        run: npm run package:linux
      - name: Start the native packaged application
        if: runner.os != 'Linux'
        run: node tools/smoke-package.cjs
      - name: Start the native packaged application with a virtual display
        if: runner.os == 'Linux'
        run: xvfb-run -a node tools/smoke-package.cjs
