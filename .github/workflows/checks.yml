name: Framework checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - run: npm run build:bridge
      - run: npm test
      - name: Package macOS universal application
        if: runner.os == 'macOS'
        run: npm run package:mac
      - name: Package Windows x64 application
        if: runner.os == 'Windows'
        run: npm run package:win
      - name: Package Linux x64 application
        if: runner.os == 'Linux'
        run: npm run package:linux
      - name: Build and install the Linux Debian package
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm
          python3 tools/build-linux-packages.py
          sudo apt-get install -y ./releases/publish/*.deb
          test "$(stat -c '%U:%a' /opt/xplorers-redressed/chrome-sandbox)" = "root:4755"
      - name: Start the native packaged application
        if: runner.os != 'Linux'
        run: node tools/smoke-package.cjs
      - name: Start the installed Linux application with a virtual display
        if: runner.os == 'Linux'
        run: xvfb-run -a node tools/smoke-package.cjs "/opt/xplorers-redressed/Xplorers Redressed"
      - name: Install and start the RPM payload as a normal user
        if: runner.os == 'Linux'
        run: |
          sudo dpkg -r xplorers-redressed
          sudo rpm --nodeps --install releases/publish/*.rpm
          test "$(stat -c '%U:%a' /opt/xplorers-redressed/chrome-sandbox)" = "root:4755"
          xvfb-run -a node tools/smoke-package.cjs "/opt/xplorers-redressed/Xplorers Redressed"
      - name: Archive tested Windows and Linux applications
        if: runner.os != 'macOS'
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$RUNNER_OS" = "Windows" ]; then
            python tools/archive-package.py "releases/Xplorers Redressed-win32-x64" "releases/publish/xplorers-redressed-$version-windows-x64.zip"
          else
            python3 tools/archive-package.py "releases/Xplorers Redressed-linux-x64" "releases/publish/xplorers-redressed-$version-linux-x64.zip"
          fi
      - name: Upload tested release downloads
        if: runner.os != 'macOS'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ runner.os }}
          path: releases/publish/*
          if-no-files-found: error
          compression-level: 0
