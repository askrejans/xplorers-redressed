name: Upload tested release downloads
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing draft release tag
        required: true
        type: string
      run-id:
        description: Successful Framework checks run for the release commit
        required: true
        type: string
jobs:
  upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ inputs.tag }}
      TEST_RUN_ID: ${{ inputs.run-id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - name: Verify the tested release commit
        run: |
          set -euo pipefail
          [[ "$TEST_RUN_ID" =~ ^[0-9]+$ ]]
          test "$(gh run view "$TEST_RUN_ID" --json conclusion --jq .conclusion)" = success
          test "$(gh run view "$TEST_RUN_ID" --json headSha --jq .headSha)" = "$(git rev-parse HEAD)"
      - name: Download the tested native packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.run-id }}
          pattern: release-*
          merge-multiple: true
          path: releases/publish
      - name: Upload downloads to the draft without replacing assets
        run: |
          set -euo pipefail
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          gh release upload "$RELEASE_TAG" releases/publish/*
